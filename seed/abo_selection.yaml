# Hand-reviewed subset of the Amazon Berkeley Objects (ABO) dataset used for seed images.
# Source: https://amazon-berkeley-objects.s3.amazonaws.com/index.html — licence CC BY 4.0.
# Review rule: gold items and every listed photo show NO visible real brand, logo or text
# (checked visually on data/abo/review contact sheets; infographic/dimension shots excluded).
# Each ABO item appears in at most one pool, so counterfeit photos never share a base photo
# with lookalikes. Products are re-branded with the fictional mark; names, prices are fictional.

