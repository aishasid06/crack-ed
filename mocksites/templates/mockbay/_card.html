<li class="s-item">
  <a class="s-item__link" href="/mockbay/item/{{ l.id }}">
    <div class="s-item__image"><img src="/media/{{ l.images[0] }}" alt="{{ l.title }}" loading="lazy"></div>
    <h3 class="s-item__title">{{ l.title }}</h3>
  </a>
  <div class="s-item__price">{{ l.price|money(l.currency) }}</div>
  <div class="s-item__meta"><span class="s-item__seller">{{ l.seller_name }}</span> · <span class="s-item__location">From {{ l.seller_location }}</span></div>
  <div class="s-item__condition">{{ l.condition }}</div>
</li>
