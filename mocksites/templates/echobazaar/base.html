<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}EchoBazaar{% endblock %} | EchoBazaar</title>
<link rel="stylesheet" href="/static/echobazaar.css"></head>
<body>
<header class="mb-header">
  <a class="mb-logo" href="/echobazaar/">Echo<span>Bazaar</span></a>
  <form class="mb-searchbar" action="/echobazaar/search" method="get" role="search">
    <input type="search" name="q" value="{{ q|default('') }}" placeholder="Search for anything" aria-label="Search EchoBazaar">
    <button type="submit">Search</button>
  </form>
</header>
<main class="mb-main">{% block content %}{% endblock %}</main>
{% if consent_needed %}
<div id="cookie-consent" class="mb-consent-overlay" role="dialog" aria-modal="true" aria-labelledby="consent-title">
  <div class="mb-consent-box">
    <h2 id="consent-title">We value your privacy</h2>
    <p>EchoBazaar uses cookies to remember your preferences. Choose an option to continue browsing.</p>
    <form method="post" action="/echobazaar/consent">
      <input type="hidden" name="next" value="{{ path }}">
      <button type="submit" name="choice" value="all" id="consent-accept">Accept all</button>
      <button type="submit" name="choice" value="essential" id="consent-essential">Essential only</button>
    </form>
  </div>
</div>
{% endif %}
</body></html>
